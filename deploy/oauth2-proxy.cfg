# Config NO secreta de oauth2-proxy (los secretos van en /etc/bajaj/oauth2-proxy.env).
# setup.sh la instala en /etc/oauth2-proxy/oauth2-proxy.cfg, propiedad de root: quien manda en la
# puerta de entrada no puede ser el usuario que corre la app.

http_address = "127.0.0.1:4180"
upstreams = [ "http://127.0.0.1:3000" ]

provider = "google"
authenticated_emails_file = "/etc/oauth2-proxy/emails-autorizados"

# Quién puede entrar: SOLO los correos de esta lista (una línea por correo, la edita root).
# A propósito NO hay `email_domains = ["*"]`: junto con la lista dejaría entrar a cualquiera.

# El navegador manda su propio `Authorization` (el Basic Auth de proxy.ts). Con esto en
# true oauth2-proxy lo pisaría con uno suyo y la app rechazaría siempre la clave, sumando
# intentos fallidos al bloqueo por IP.
pass_basic_auth = false
pass_user_headers = false

# Solo escucha en 127.0.0.1 y detrás hay Tailscale Funnel, que es quien pone X-Forwarded-*.
reverse_proxy = true
trusted_ips = [ "127.0.0.1/32", "::1/128" ]

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"

# Una sola persona y un solo proveedor: sin botón intermedio "Sign in with Google".
skip_provider_button = true
silence_ping_logging = true
